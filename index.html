<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Swipe</title>
  <meta name="theme-color" content="#111111" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Swipe" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #111111;
      --surface: #1b1b1f;
      --text: #F4F1EC;
      --muted: #8D8A94;
      --amber: #FFB547;
      --coral: #FF6F59;
      --red: #FF4B5C;
      --green: #2ED573;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px 20px 6px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: linear-gradient(135deg, var(--amber), var(--coral));
      box-shadow: 0 0 16px rgba(255, 111, 89, 0.6);
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--amber), var(--coral));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 8px 0 0;
    }

    .deck {
      position: relative;
      height: min(calc(100dvh - 250px), 580px);
      aspect-ratio: 2 / 3;
      max-width: 90vw;
    }

    .card {
      position: absolute;
      inset: 0;
      border-radius: 26px;
      overflow: hidden;
      background: var(--surface);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.05);
      touch-action: none;
      will-change: transform;
      transition: transform 0.3s ease;
      transform-origin: 50% 85%;
    }
    .card.dragging { transition: none; }
    .card[data-pos="0"] { transform: none; }
    .card[data-pos="1"] { transform: translateY(14px) scale(0.95); }
    .card[data-pos="2"] { transform: translateY(28px) scale(0.9); }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .card.noimg { background: linear-gradient(160deg, #3a2a4d, #5a2f3b 60%, #7a4a2a); }
    .card.noimg::before {
      content: attr(data-initial);
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 120px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.25);
    }

    .shade {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 48%;
      background: linear-gradient(to top, rgba(0,0,0,0.88), rgba(0,0,0,0));
      pointer-events: none;
    }

    .info {
      position: absolute;
      left: 22px; right: 22px; bottom: 22px;
      pointer-events: none;
    }
    .info h2 {
      margin: 0;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .info h2 span { font-size: 24px; font-weight: 400; color: rgba(244, 241, 236, 0.85); }
    .info p { margin: 4px 0 0; font-size: 14px; color: rgba(244, 241, 236, 0.7); }

    .stamp {
      position: absolute;
      top: 30px;
      padding: 4px 12px;
      border-radius: 10px;
      border: 3px solid;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.06em;
      opacity: 0;
      pointer-events: none;
    }
    .stamp.like { left: 22px; color: var(--green); border-color: var(--green); transform: rotate(-14deg); }
    .stamp.nope { right: 22px; color: var(--red); border-color: var(--red); transform: rotate(14deg); }

    .actions {
      display: flex;
      justify-content: center;
      gap: 34px;
      padding: 18px 0 26px;
    }
    .btn {
      width: 68px; height: 68px;
      border-radius: 50%;
      border: 1.5px solid;
      background: var(--surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn:active { transform: scale(0.9); }
    .btn svg { width: 30px; height: 30px; }
    .btn.no { border-color: var(--red); box-shadow: 0 0 24px rgba(255, 75, 92, 0.25); }
    .btn.yes { border-color: var(--green); box-shadow: 0 0 24px rgba(46, 213, 115, 0.25); }
  </style>
</head>

<body>
  <header>
    <div class="dot"></div>
    <h1>Swipe</h1>
  </header>

  <div class="stage">
    <div class="deck" id="deck"></div>
  </div>

  <div class="actions">
    <button class="btn no" id="noBtn" type="button" aria-label="Pass">
      <svg viewBox="0 0 24 24" fill="none" stroke="#FF4B5C" stroke-width="2.6" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
    <button class="btn yes" id="yesBtn" type="button" aria-label="Like">
      <svg viewBox="0 0 24 24" fill="#2ED573">
        <path d="M12 21s-7.5-4.6-9.6-9.3C1 8.5 2.8 5 6.2 5c2 0 3.4 1.1 4.1 2.3.4.6 1.2.6 1.4 0C12.4 6.1 13.9 5 15.8 5c3.4 0 5.2 3.5 3.8 6.7C19.5 16.4 12 21 12 21z"/>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      var P = [
        { n: 'Amara', a: 24, c: 'Lagos', i: 47 },
        { n: 'Tobi', a: 27, c: 'Abuja', i: 12 },
        { n: 'Zainab', a: 23, c: 'Kano', i: 45 },
        { n: 'Chidi', a: 29, c: 'Enugu', i: 33 },
        { n: 'Ifeoma', a: 26, c: 'Port Harcourt', i: 25 },
        { n: 'Emeka', a: 31, c: 'Owerri', i: 52 },
        { n: 'Ngozi', a: 25, c: 'Asaba', i: 20 },
        { n: 'Bayo', a: 28, c: 'Ibadan', i: 59 },
        { n: 'Efe', a: 22, c: 'Benin City', i: 5 },
        { n: 'Kemi', a: 30, c: 'Abeokuta', i: 29 },
        { n: 'Uche', a: 27, c: 'Awka', i: 15 },
        { n: 'Sade', a: 24, c: 'Lagos', i: 49 }
      ];

      var deck = document.getElementById('deck');
      var THRESH = 100;
      var busy = false;
      var nextI = 0;

      function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

      function make(p, pos) {
        var el = document.createElement('div');
        el.className = 'card';
        el.dataset.pos = String(pos);
        el.dataset.initial = p.n.charAt(0);

        var img = document.createElement('img');
        img.src = 'https://i.pravatar.cc/600?img=' + p.i;
        img.alt = p.n;
        img.draggable = false;
        img.decoding = 'async';
        img.onerror = function () { el.classList.add('noimg'); img.remove(); };
        el.appendChild(img);

        var shade = document.createElement('div');
        shade.className = 'shade';
        el.appendChild(shade);

        var like = document.createElement('div');
        like.className = 'stamp like';
        like.textContent = 'LIKE';
        el.appendChild(like);

        var nope = document.createElement('div');
        nope.className = 'stamp nope';
        nope.textContent = 'NOPE';
        el.appendChild(nope);

        var info = document.createElement('div');
        info.className = 'info';
        var h2 = document.createElement('h2');
        h2.textContent = p.n + ' ';
        var age = document.createElement('span');
        age.textContent = p.a;
        h2.appendChild(age);
        var loc = document.createElement('p');
        loc.textContent = p.c;
        info.appendChild(h2);
        info.appendChild(loc);
        el.appendChild(info);

        el._like = like;
        el._nope = nope;

        var sx = 0, sy = 0, dx = 0, dy = 0, drag = false;

        el.addEventListener('touchstart', function (e) {
          if (busy || el.dataset.pos !== '0') return;
          var t = e.touches[0];
          sx = t.clientX; sy = t.clientY; dx = 0; dy = 0;
          drag = true;
          el.classList.add('dragging');
        }, { passive: true });

        el.addEventListener('touchmove', function (e) {
          if (!drag) return;
          e.preventDefault();
          var t = e.touches[0];
          dx = t.clientX - sx;
          dy = t.clientY - sy;
          el.style.transform = 'translate(' + dx + 'px,' + dy + 'px) rotate(' + (dx * 0.06) + 'deg)';
          like.style.opacity = clamp(dx / 90, 0, 1);
          nope.style.opacity = clamp(-dx / 90, 0, 1);
          var next = el.previousElementSibling;
          if (next) {
            var k = clamp(Math.abs(dx) / 160, 0, 1);
            next.style.transition = 'none';
            next.style.transform = 'translateY(' + (14 - 14 * k) + 'px) scale(' + (0.95 + 0.05 * k) + ')';
          }
        }, { passive: false });

        function end() {
          if (!drag) return;
          drag = false;
          el.classList.remove('dragging');
          if (Math.abs(dx) > THRESH) {
            fly(dx > 0 ? 1 : -1, dy);
          } else {
            el.style.transform = '';
            like.style.opacity = 0;
            nope.style.opacity = 0;
            var next = el.previousElementSibling;
            if (next) { next.style.transition = ''; next.style.transform = ''; }
          }
        }
        el.addEventListener('touchend', end);
        el.addEventListener('touchcancel', end);

        return el;
      }

      function addBack() {
        var card = make(P[nextI % P.length], 2);
        nextI++;
        deck.insertBefore(card, deck.firstChild);
      }

      function fly(dir, dy0) {
        if (busy) return;
        var top = deck.lastElementChild;
        if (!top) return;
        busy = true;

        top.classList.remove('dragging');
        top.style.transition = 'transform 0.38s cubic-bezier(.3,.7,.4,1), opacity 0.38s ease';
        top.style.transform = 'translate(' + (dir * window.innerWidth * 1.3) + 'px,' + ((dy0 || 0) + 30) + 'px) rotate(' + (dir * 28) + 'deg)';
        top.style.opacity = '0';
        (dir > 0 ? top._like : top._nope).style.opacity = '1';

        var rest = Array.prototype.slice.call(deck.children, 0, -1).reverse();
        rest.forEach(function (c, i) {
          c.style.transition = '';
          c.style.transform = '';
          c.dataset.pos = String(i);
        });

        setTimeout(function () {
          top.remove();
          addBack();
          busy = false;
        }, 380);
      }

      // initial stack: back card first, top card last
      for (var i = 2; i >= 0; i--) {
        deck.appendChild(make(P[i], i));
      }
      nextI = 3;

      document.getElementById('noBtn').addEventListener('click', function () { fly(-1, 0); });
      document.getElementById('yesBtn').addEventListener('click', function () { fly(1, 0); });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') fly(-1, 0);
        if (e.key === 'ArrowRight') fly(1, 0);
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function (err) {
            console.warn('Service worker registration failed:', err);
          });
        });
      }
    })();
  </script>
</body>
</html>
